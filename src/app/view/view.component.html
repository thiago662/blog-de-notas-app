<h1 class="h1 fw-bolder">{{ post?.title }}</h1>

<h4 class="h4">{{ post?.subtitle }}</h4>

<small class="fw-bolder">{{ post?.created_by }}</small>
<br>
<small>{{ showDate(post?.created_at) }}</small>
<br>

@for (topic of splitTopic(post?.topics); track $index) {
    <span class="badge" [ngClass]="post?.category == 'programação' ? 'text-bg-pink' : (post?.category == 'administração' ? 'text-bg-yellow' : (post?.category == 'dicas' ? 'text-bg-green' : (post?.category == 'ensaio' ? 'text-bg-orange' : (post?.category == 'produtividade' ? 'text-bg-blue' : 'text-bg-red'))))">{{ topic }}</span>
} @empty {

}

<div class="mt-3" [innerHtml]="getSafeHtml(post.html)"></div>
