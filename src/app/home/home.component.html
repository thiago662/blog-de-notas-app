<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3 mt-3">
@for (post of posts; track $index) {
    <div class="card text-center border border-opacity-50 border-3 rounded-0 m-3" [routerLink]="['/' + post?.id]" style="width: 18rem;" [ngClass]="post?.category == 'programação' ? 'bg-pink' : (post?.category == 'administração' ? 'bg-yellow' : (post?.category == 'dicas' ? 'bg-green' : (post?.category == 'ensaio' ? 'bg-orange' : (post?.category == 'produtividade' ? 'bg-blue' : 'bg-red'))))">
        <div class="card-body">
            <h5 class="card-title">{{ post?.title }}</h5>
            <p class="card-text">{{ post?.subtitle }}</p>
            <p class="card-text text-start">{{ post?.category }}</p>
        </div>
        <div class="card-footer text-body-secondary d-flex justify-content-between align-items-center bottom-0 border border-0" [ngClass]="post?.category == 'programação' ? 'bg-pink' : (post?.category == 'administração' ? 'bg-yellow' : (post?.category == 'dicas' ? 'bg-green' : (post?.category == 'ensaio' ? 'bg-orange' : (post?.category == 'produtividade' ? 'bg-blue' : 'bg-red'))))">
            <small class="text-body-secondary">{{ post?.created_by }}</small>
            <small class="text-body-secondary">{{ showDate(post?.created_at) }}</small>
          </div>
    </div>
}
@empty {
    <p>Nada</p>
}
</div>
